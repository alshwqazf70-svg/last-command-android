name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, "build/**"]

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          test -f project.godot
          test -f scenes/main.tscn
          test -f scripts/game.gd
          test -f export_presets.cfg

      - name: Prepare Android export environment
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends curl unzip openjdk-17-jdk
          export ANDROID_SDK_ROOT="/opt/android-sdk"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          mkdir -p /tmp/android-cli
          curl -fL --retry 3 -o /tmp/android-command-line-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/android-command-line-tools.zip -d /tmp/android-cli
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          cp -a /tmp/android-cli/cmdline-tools/. "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          set +o pipefail
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          curl -fL --retry 3 -o /tmp/godot-templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          JAVA_BIN="$(command -v java)"
          JAVA_HOME_PATH="$(dirname "$(dirname "$(readlink -f "$JAVA_BIN")")")"
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME_PATH"
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/timestamping_authority_url = ""
          export/android/shutdown_adb_on_exit = true
          EOF

          echo "=== Android SDK packages ==="
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --list_installed
          echo "=== Java ==="
          java -version
          echo "=== Godot export templates ==="
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          echo "=== Debug keystore ==="
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey
          echo "=== Godot Android export prerequisites ==="
          cat "$HOME/.config/godot/editor_settings-4.4.tres"
          test -x "$JAVA_HOME_PATH/bin/java"
          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_release.apk"
          test -s "$HOME/.android/debug.keystore"

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit --verbose 2>&1 | tee /tmp/godot-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/godot-import.log; then
            echo 'Godot reported script import errors.'
            exit 1
          fi

      - name: Export Android APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /github/home/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
          ANDROID_SDK_ROOT: /opt/android-sdk
          ANDROID_HOME: /opt/android-sdk
        run: |
          echo "=== Export environment ==="
          printf "HOME=%s\nANDROID_SDK_ROOT=%s\nANDROID_HOME=%s\nJAVA_HOME=%s\n" "$HOME" "$ANDROID_SDK_ROOT" "$ANDROID_HOME" "$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          test -s "$HOME/.config/godot/editor_settings-4.4.tres"
          test -s "$HOME/.android/debug.keystore"
          mkdir -p build
          set -o pipefail
          godot --headless --verbose --path . --export-debug "Android" build/LastCommand-debug.apk 2>&1 | tee /tmp/godot-export.log
          test -s build/LastCommand-debug.apk
          python3 -c 'import zipfile; p="build/LastCommand-debug.apk"; z=zipfile.ZipFile(p); bad=z.testzip(); assert bad is None, f"Corrupt APK entry: {bad}"; print(f"APK archive verified: {len(z.namelist())} entries")'
          sha256sum build/LastCommand-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LastCommand-Android-Debug
          path: build/LastCommand-debug.apk
          if-no-files-found: error
          retention-days: 14

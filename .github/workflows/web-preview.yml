name: Web Preview

on:
  push:
    branches:
      - game-foundation
    paths:
      - "project/**"
      - ".github/workflows/web-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and publish browser version
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config
          if [ -d /root/.config/godot ]; then
            cp -a /root/.config/godot ~/.config/
          fi
          if [ -d /root/.local/share/godot/export_templates/4.7.2.stable ]; then
            cp -a /root/.local/share/godot/export_templates/4.7.2.stable ~/.local/share/godot/export_templates/
          fi

      - name: Install Linux font support
        run: |
          apt-get update
          apt-get install -y --no-install-recommends fontconfig

      - name: Import and validate project
        run: godot --headless --editor --path project --quit

      - name: Smoke-test game scenes
        shell: bash
        run: |
          set -euo pipefail
          for scene in \
            res://scenes/base_preview.tscn \
            res://scenes/mission.tscn \
            res://scenes/convoy_run.tscn; do
            log_file="$(mktemp)"
            echo "Testing $scene"
            godot --headless --path project --quit-after 8 "$scene" 2>&1 | tee "$log_file"
            if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" "$log_file"; then
              echo "Godot script error detected in $scene"
              exit 1
            fi
            rm -f "$log_file"
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Export Web build
        run: |
          mkdir -p build/web
          godot --headless --path project --export-release "Web" "$PWD/build/web/index.html"
          test -s build/web/index.html
          find build/web -maxdepth 1 -type f -printf '%f %s bytes\\n'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show published URL
        run: echo "Published game URL: ${{ steps.deployment.outputs.page_url }}"
